<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Replacement Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Page replacement simulator</h1>
  <p class="sub">Compare FIFO, LRU and Optimal on the same reference string.</p>

  <section class="panel">
    <div class="field wide">
      <label for="refs">Page-reference string</label>
      <input id="refs" type="text" value="7 0 1 2 0 3 0 4 2 3" placeholder="e.g. 7 0 1 2 0 3 0 4 2 3">
    </div>
    <div class="field">
      <label for="frames">Page frames</label>
      <input id="frames" type="number" min="1" max="10" value="3">
    </div>
    <div class="field">
      <label for="algo">Algorithm</label>
      <select id="algo">
        <option value="1">FIFO</option>
        <option value="2">LRU</option>
        <option value="3">Optimal</option>
        <option value="4" selected>Compare all</option>
      </select>
    </div>
    <button id="run">Run simulation</button>
  </section>

  <p id="msg" role="status"></p>
  <div id="output"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
